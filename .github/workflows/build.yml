name: Build

# Every push to main (and a manual run) builds a new version YYYY.M.<run number>
# and publishes it as a GitHub pre-release; pull requests only build and test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        # YYYY.M.N: N = github.run_number, monotonic per workflow, so every build differs.
        run: echo "version=$(date -u +%Y.%-m).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # The Plugin Verifier downloads two IDEs.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # IntelliJ Platform 2024.2 (242) requires Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Sync the zell repository (grammar, corpus)
        run: tools/sync-zell.sh

      - name: Committed grammar matches the pinned zell commit
        run: git diff --exit-code src/main/grammar/Zell.bnf

      - name: Build and test
        run: ./gradlew buildPlugin test -PpluginVersion=${{ steps.version.outputs.version }} --no-daemon --stacktrace

      - name: Generated lexer/parser are committed and current
        # CLAUDE.md: src/main/gen is committed so IDE indexing works without a build.
        run: |
          git status --porcelain src/main/gen
          test -z "$(git status --porcelain src/main/gen)"

      - name: Plugin Verifier (IC 2024.2.4, IU 2025.2)
        run: ./gradlew verifyPlugin -PpluginVersion=${{ steps.version.outputs.version }} --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: zell-idea-plugin-${{ steps.version.outputs.version }}
          path: build/distributions/*.zip

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/reports/pluginVerifier

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags and history for the notes

      - uses: actions/download-artifact@v4
        with:
          name: zell-idea-plugin-${{ needs.build.outputs.version }}
          path: dist

      - name: Release notes
        run: |
          {
            echo "Install: download \`$(basename dist/*.zip)\`, then **Settings › Plugins › ⚙ › Install Plugin from Disk…**."
            echo
            # The Unreleased section of CHANGELOG.md, if present.
            if [ -f CHANGELOG.md ]; then
              awk '/^## /{ if (p) exit; if (tolower($0) ~ /^## unreleased/) { p=1; next } } p' CHANGELOG.md
            fi
            prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
            echo
            if [ -n "$prev" ]; then
              echo "### Commits since $prev"
              range="$prev..HEAD"
            else
              echo "### Commits"
              range="HEAD"
            fi
            echo
            git log --no-merges --format='- %s (%h)' "$range" | head -200
          } > notes.md
          cat notes.md

      - name: Create the GitHub release
        run: |
          gh release create "v$VERSION" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Zell IDEA plugin $VERSION" \
            --notes-file notes.md \
            --prerelease
